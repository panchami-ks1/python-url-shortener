AWSTemplateFormatVersion: '2010-09-09'
Description: ECS Fargate and ALB Infrastructure for URL Shortener Service.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    Description: Environment name (e.g. dev, prod)

  ContainerImage:
    Type: String
    Default: 123456789012.dkr.ecr.us-east-1.amazonaws.com/url-shortener-backend:latest
    Description: Docker image URI to deploy

  DBUsername:
    Type: String
    Default: url_user
    Description: Database master username

  DBPassword:
    Type: String
    NoEcho: true
    Description: Database master password

  SecretKey:
    Type: String
    NoEcho: true
    Description: Secret key for FastAPI JWT generation

Resources:


  # Log Group for ECS container stdout/stderr
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}-url-shortener
      RetentionInDays: 7

  # Security Groups
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Security group for ${EnvironmentName} ALB
      VpcId:
        Fn::ImportValue: !Sub ${EnvironmentName}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-alb-sg

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Security group for ${EnvironmentName} ECS tasks
      VpcId:
        Fn::ImportValue: !Sub ${EnvironmentName}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ecs-sg

  # Ingress Rules for Database and Redis (Linking ECS stack to DB stack)
  DatabaseIngressRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub ${EnvironmentName}-DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref EcsSecurityGroup

  RedisIngressRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub ${EnvironmentName}-RedisSecurityGroupId
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      SourceSecurityGroupId: !Ref EcsSecurityGroup

  # Application Load Balancer
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${EnvironmentName}-alb
      Scheme: internet-facing
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '60'
      Subnets:
        - Fn::ImportValue: !Sub ${EnvironmentName}-PublicSubnet1Id
        - Fn::ImportValue: !Sub ${EnvironmentName}-PublicSubnet2Id
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-alb

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${EnvironmentName}-tg
      Port: 8000
      Protocol: HTTP
      VpcId:
        Fn::ImportValue: !Sub ${EnvironmentName}-VpcId
      TargetType: ip
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /docs
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-tg

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP

  # IAM Roles
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${EnvironmentName}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # ECS Task Definition
  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref EcsTaskExecutionRole
      TaskRoleArn: !Ref EcsTaskRole
      ContainerDefinitions:
        - Name: api
          Image: !Ref ContainerImage
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: POSTGRES_SERVER
              Value:
                Fn::ImportValue: !Sub ${EnvironmentName}-DatabaseEndPointAddress
            - Name: POSTGRES_PORT
              Value:
                Fn::ImportValue: !Sub ${EnvironmentName}-DatabaseEndPointPort
            - Name: POSTGRES_USER
              Value: !Ref DBUsername
            - Name: POSTGRES_PASSWORD
              Value: !Ref DBPassword
            - Name: POSTGRES_DB
              Value: url_shortener
            - Name: REDIS_HOST
              Value:
                Fn::ImportValue: !Sub ${EnvironmentName}-RedisEndPointAddress
            - Name: REDIS_PORT
              Value:
                Fn::ImportValue: !Sub ${EnvironmentName}-RedisEndPointPort
            - Name: SECRET_KEY
              Value: !Ref SecretKey
            - Name: BASE_URL
              Value: !Sub http://${ALB.DNSName}

  # ECS Service
  ECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - AlbListener
      - DatabaseIngressRule
      - RedisIngressRule
    Properties:
      ServiceName: !Sub ${EnvironmentName}-api
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ECSTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref EcsSecurityGroup
          Subnets:
            - Fn::ImportValue: !Sub ${EnvironmentName}-PublicSubnet1Id
            - Fn::ImportValue: !Sub ${EnvironmentName}-PublicSubnet2Id
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8000
          TargetGroupArn: !Ref AlbTargetGroup

Outputs:
  EcsClusterName:
    Description: ECS Cluster Name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub ${EnvironmentName}-EcsClusterName

  EcsServiceName:
    Description: ECS Service Name
    Value: !GetAtt ECSService.Name
    Export:
      Name: !Sub ${EnvironmentName}-EcsServiceName



  ServiceUrl:
    Description: URL of the Load Balancer
    Value: !Sub http://${ALB.DNSName}
    Export:
      Name: !Sub ${EnvironmentName}-ServiceUrl
